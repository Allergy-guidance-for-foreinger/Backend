services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tomato7000/mealguide-api:dev
    container_name: mealguide-app-dev
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTUATOR_EXPOSE: ${ACTUATOR_EXPOSE:-health,info,prometheus}
      TZ: Asia/Seoul
    networks:
      - default
      - meal-guide-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mealguide-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mealguide-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mealguide-prometheus
    depends_on:
      app:
        condition: service_started
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-3d}
    volumes:
      - ./monitoring/dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/dev/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-dev-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: mealguide-grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-dev-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-dev-data:
  redis-dev-data:
  prometheus-dev-data:
  grafana-dev-data:

networks:
  meal-guide-network:
    external: true
