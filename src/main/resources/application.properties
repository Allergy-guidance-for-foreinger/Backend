spring.application.name=${APP_NAME:mealguide-api}

# ===== Server =====
server.port=${APP_PORT:8080}

# ===== JWT =====
mealguide.jwt.access-secret=${JWT_ACCESS_SECRET}
mealguide.jwt.refresh-secret=${JWT_REFRESH_SECRET}
mealguide.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
mealguide.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

# ===== Google OAuth =====
mealguide.google.client-id=${GOOGLE_CLIENT_ID}

# ===== Auth Debug =====
mealguide.auth-debug.enabled=${AUTH_DEBUG_ENABLED:false}

# ===== Meal Crawl =====
mealguide.mealcrawl.scheduler-enabled=${MEAL_CRAWL_SCHEDULER_ENABLED:true}
mealguide.mealcrawl.scheduler-lock-key=${MEAL_CRAWL_SCHEDULER_LOCK_KEY:20260416}
mealguide.mealcrawl.python-base-url=${MEAL_CRAWL_PYTHON_BASE_URL:http://localhost:8000}
mealguide.mealcrawl.crawl-path=${MEAL_CRAWL_CRAWL_PATH:/api/v1/crawl/meals}
mealguide.mealcrawl.analysis-path=${MEAL_CRAWL_ANALYSIS_PATH:/api/v1/menus/analyze}
mealguide.mealcrawl.image-analysis-path=${MEAL_CRAWL_IMAGE_ANALYSIS_PATH:/api/v1/python/menus/analyze-image}
mealguide.mealcrawl.translation-path=${MEAL_CRAWL_TRANSLATION_PATH:/api/v1/python/menus/translate}
mealguide.mealcrawl.text-translation-path=${MEAL_CRAWL_TEXT_TRANSLATION_PATH:/api/v1/translations}
mealguide.mealcrawl.ingredient-translation-path=${MEAL_CRAWL_INGREDIENT_TRANSLATION_PATH:/api/v1/python/translations/list}
mealguide.mealcrawl.translation-target-languages=${MEAL_CRAWL_TRANSLATION_TARGET_LANGUAGES:en}

mealguide.mealcrawl.scheduler-cron=${MEAL_CRAWL_SCHEDULER_CRON:0 31 20 * * *}
mealguide.mealcrawl.ai-analysis-batch-size=${MEAL_CRAWL_AI_ANALYSIS_BATCH_SIZE:5}
mealguide.mealcrawl.translation-batch-size=${MEAL_CRAWL_TRANSLATION_BATCH_SIZE:8}

mealguide.mealcrawl.analysis-retry-cron=${MEAL_CRAWL_ANALYSIS_RETRY_CRON:0 34 20 * * *}
mealguide.mealcrawl.ai-analysis-retry-batch-size=${MEAL_CRAWL_AI_ANALYSIS_RETRY_BATCH_SIZE:5}
mealguide.mealcrawl.ai-analysis-max-attempt-count=${MEAL_CRAWL_AI_ANALYSIS_MAX_ATTEMPT_COUNT:3}

mealguide.mealcrawl.translation-retry-batch-size=${MEAL_CRAWL_TRANSLATION_RETRY_BATCH_SIZE:8}
mealguide.mealcrawl.translation-max-attempt-count=${MEAL_CRAWL_TRANSLATION_MAX_ATTEMPT_COUNT:3}

mealguide.mealcrawl.ingredient-translation-batch-size=${MEAL_CRAWL_INGREDIENT_TRANSLATION_BATCH_SIZE:10}
mealguide.mealcrawl.ingredient-translation-max-batches-per-run=${MEAL_CRAWL_INGREDIENT_TRANSLATION_MAX_BATCHES_PER_RUN:5}

mealguide.mealcrawl.weekly-meal-cache-ttl-seconds=${MEAL_CRAWL_WEEKLY_MEAL_CACHE_TTL_SECONDS:86400}

mealguide.mealcrawl.risk-policy.allergy.enabled=${MEAL_CRAWL_RISK_ALLERGY_ENABLED:true}
mealguide.mealcrawl.risk-policy.allergy.caution-threshold=${MEAL_CRAWL_RISK_ALLERGY_CAUTION_THRESHOLD:0.50}
mealguide.mealcrawl.risk-policy.allergy.danger-threshold=${MEAL_CRAWL_RISK_ALLERGY_DANGER_THRESHOLD:0.80}
mealguide.mealcrawl.risk-policy.allergy.default-when-confidence-missing=${MEAL_CRAWL_RISK_ALLERGY_DEFAULT:SAFE}
mealguide.mealcrawl.risk-policy.religious.enabled=${MEAL_CRAWL_RISK_RELIGIOUS_ENABLED:true}
mealguide.mealcrawl.risk-policy.religious.caution-threshold=${MEAL_CRAWL_RISK_RELIGIOUS_CAUTION_THRESHOLD:0.50}
mealguide.mealcrawl.risk-policy.religious.danger-threshold=${MEAL_CRAWL_RISK_RELIGIOUS_DANGER_THRESHOLD:0.80}
mealguide.mealcrawl.risk-policy.religious.default-when-confidence-missing=${MEAL_CRAWL_RISK_RELIGIOUS_DEFAULT:SAFE}

mealguide.mealcrawl.menu-image.max-file-size-bytes=${MEAL_CRAWL_IMAGE_MAX_FILE_SIZE_BYTES:10485760}
mealguide.mealcrawl.menu-image.allowed-content-types=${MEAL_CRAWL_IMAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
mealguide.mealcrawl.menu-image.firebase.enabled=${MEAL_CRAWL_FIREBASE_ENABLED:false}
mealguide.mealcrawl.menu-image.firebase.bucket-name=${MEAL_CRAWL_FIREBASE_BUCKET_NAME}
mealguide.mealcrawl.menu-image.firebase.credentials-path=${MEAL_CRAWL_FIREBASE_CREDENTIALS_PATH}
