services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tomato7000/mealguide-api:prod
    container_name: mealguide-app-prod
    env_file:
      - .env.prod
    volumes:
      - "${MEAL_CRAWL_FIREBASE_CREDENTIALS_HOST_PATH}:${MEAL_CRAWL_FIREBASE_CREDENTIALS_PATH}:ro"
    depends_on:
      postgres:
          condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTUATOR_EXPOSE: ${ACTUATOR_EXPOSE:-health,info,prometheus}
      TZ: Asia/Seoul
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mealguide-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mealguide-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
    restart: unless-stopped
    healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: mealguide-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: "postgres:5432/${DB_NAME}?sslmode=disable"
      DATA_SOURCE_USER: "${DB_USERNAME}"
      DATA_SOURCE_PASS: "${DB_PASSWORD}"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.64.0
    container_name: mealguide-redis-exporter
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mealguide-prometheus
    depends_on:
      app:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prod/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prod/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-prod-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: mealguide-grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-prod-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-prod-data:
  redis-prod-data:
  prometheus-prod-data:
  grafana-prod-data:

networks:
  default:
    name: meal-guide-network
    external: true
