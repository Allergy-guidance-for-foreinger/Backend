groups:
  - name: mealguide-prod-alerts
    rules:
      - alert: MealguideProdHighErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m]))) > 0.03
        for: 5m
        labels:
          severity: critical
          environment: prod
        annotations:
          summary: "Prod 5xx error rate is above 3% for 5m"

      - alert: MealguideProdHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
          environment: prod
        annotations:
          summary: "Prod p95 latency is above 1s for 5m"

      - alert: MealguideProdInstanceDown
        expr: up{job="mealguide-app-prod"} == 0
        for: 2m
        labels:
          severity: critical
          environment: prod
        annotations:
          summary: "Prod app scrape target is down for 2m"
