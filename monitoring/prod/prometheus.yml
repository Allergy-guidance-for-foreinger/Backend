global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: mealguide-app-prod
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080

  - job_name: mealguide-postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: mealguide-redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
