global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: mealguide-app-dev
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080

  - job_name: mealguide-postgres-exporter-dev
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: mealguide-redis-exporter-dev
    static_configs:
      - targets:
          - redis-exporter:9121
